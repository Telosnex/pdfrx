name: pdfrx_example
description: 'Demonstrates how to use the pdfrx plugin.'
publish_to: 'none'

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  pdfrx:
    path: ../../

  cupertino_icons: ^1.0.9
  rxdart: ^0.28.0
  url_launcher: ^6.3.2
  synchronized: ^3.4.0
  file_selector: ^1.1.0
  http: ^1.6.0

  material_ui: ^1.0.0
dev_dependencies:
  integration_test:
    sdk: flutter
  # Web integration tests: the result of every test, and the browser console.
  telosnex_web_test:
    git:
      url: https://github.com/Telosnex/telosnex_ci_tools.git
      path: packages/telosnex_web_test
      ref: v0.5.3
  flutter_test:
    sdk: flutter
  flutter_lints:

flutter:
  uses-material-design: true

  assets:
    - assets/
