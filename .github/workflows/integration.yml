name: Integration

on:
  push:
    # ci/** branches run it too: a new workflow cannot be started by hand
    # before it is on master.
    branches: [master, 'ci/**']
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

# Each job runs the example app's integration tests (text extraction, page
# rendering, selection drag) on its platform. The desktop and Android jobs run
# one file per flutter test; the web and iOS jobs run integration_test/all.dart,
# which holds every test, because their app build and launch is slow.
jobs:
  # The desktop jobs share the steps of the first (YAML anchor); DEVICE is the
  # flutter device.
  desktop-linux-x64:
    name: Linux x64
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DEVICE: linux
    steps: &desktop_steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang cmake ninja-build pkg-config libgtk-3-dev xvfb > /dev/null
      - uses: Telosnex/telosnex_ci_tools/actions/setup-flutter@cba77fc0d4330f1bef81193c53cd7dd976f0ebcf # v0.5.3
      - run: flutter pub get
        working-directory: packages/pdfrx/example/viewer
      - name: Example integration tests
        working-directory: packages/pdfrx/example/viewer
        run: |
          for f in integration_test/*_test.dart; do
            run=(flutter test "$f" -d "$DEVICE" -r expanded)
            if [[ "$RUNNER_OS" == Linux ]]; then run=(xvfb-run -a "${run[@]}"); fi
            "${run[@]}"
          done

  desktop-linux-arm64:
    name: Linux ARM64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      DEVICE: linux
    steps: *desktop_steps

  desktop-macos-arm64:
    name: macOS ARM64
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVICE: macos
    steps: *desktop_steps

  desktop-windows-x64:
    name: Windows x64
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      DEVICE: windows
    steps: *desktop_steps

  # The web jobs share the steps of the first (YAML anchor). The tests of
  # integration_test/all.dart run in Chrome through the WebDriver of
  # actions/web-driver; require-result fails a run that skipped them.
  web-linux-chrome-dart2js:
    name: Web Linux x64 Chrome dart2js
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      WASM: ''
    steps: &web_steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Telosnex/telosnex_ci_tools/actions/setup-flutter@cba77fc0d4330f1bef81193c53cd7dd976f0ebcf # v0.5.3
      - run: flutter pub get
        working-directory: packages/pdfrx/example/viewer
      - uses: Telosnex/telosnex_ci_tools/actions/web-driver@cba77fc0d4330f1bef81193c53cd7dd976f0ebcf # v0.5.3
        with:
          browser: chrome
          working-directory: packages/pdfrx/example/viewer
          require-result: '.telosnexWebTestSummary.passed >= 3'
          run: |
            flutter drive --release $WASM -d web-server --browser-name chrome \
              --driver test_driver/integration_test.dart \
              --target integration_test/all.dart

  web-linux-chrome-dart2wasm:
    name: Web Linux x64 Chrome dart2wasm
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      WASM: --wasm
    steps: *web_steps

  ios:
    name: iOS ARM64 simulator
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Telosnex/telosnex_ci_tools/actions/setup-flutter@cba77fc0d4330f1bef81193c53cd7dd976f0ebcf # v0.5.3
      - run: flutter pub get
        working-directory: packages/pdfrx/example/viewer
      - uses: Telosnex/telosnex_ci_tools/actions/ios-simulator-boot@cba77fc0d4330f1bef81193c53cd7dd976f0ebcf # v0.5.3
        id: simulator
      # One target, so one Xcode build, install and launch. No build ahead
      # (flutter build ios --simulator): Xcode rebuilds for flutter test's
      # destination anyway.
      - uses: Telosnex/telosnex_ci_tools/actions/ios-flutter-test@cba77fc0d4330f1bef81193c53cd7dd976f0ebcf # v0.5.3
        with:
          working-directory: packages/pdfrx/example/viewer
          target: integration_test/all.dart
          udid: ${{ steps.simulator.outputs.udid }}
          artifact-name: ios-simulator-logs
          idle-minutes: '15'
          connect-seconds: '600'

  android:
    name: Android x64 emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Telosnex/telosnex_ci_tools/actions/setup-flutter@cba77fc0d4330f1bef81193c53cd7dd976f0ebcf # v0.5.3
      - run: flutter pub get
        working-directory: packages/pdfrx/example/viewer
      - uses: Telosnex/telosnex_ci_tools/actions/android-emulator@cba77fc0d4330f1bef81193c53cd7dd976f0ebcf # v0.5.3
        id: emulator
        with:
          api-level: '36'
      - name: Example integration tests
        working-directory: packages/pdfrx/example/viewer
        env:
          SERIAL: ${{ steps.emulator.outputs.serial }}
        run: |
          for f in integration_test/*_test.dart; do
            flutter test "$f" -d "$SERIAL" -r expanded
          done
      - name: Upload the emulator logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-emulator-logs
          path: |
            ${{ steps.emulator.outputs.log }}
            ${{ steps.emulator.outputs.logcat }}
          if-no-files-found: ignore
