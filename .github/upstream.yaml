# Upstream sources, checked daily by the Upstream watch workflow
# (telosnex_ci_tools, lib/src/upstream.dart). Set `seen` to skip an update.
sources:
  - name: bblanchon/pdfium-binaries
    tags: https://github.com/bblanchon/pdfium-binaries.git
    version: 'chromium/(\d+)'
    pin: {file: packages/pdfium_dart/pdfium.json, pattern: '"release": "chromium/(\d+)"'}
    alert: major
  # The repository this one is a fork of. The pin is the last upstream commit
  # merged here: update it with each merge. Upstream commits often, so alert
  # only once the oldest unmerged commit is a week old.
  - name: espresso3389/pdfrx
    branch: https://github.com/espresso3389/pdfrx
    pin: 78004de9a9750fbdd994d8354622a428b02d11a1
    lag_days: 7
